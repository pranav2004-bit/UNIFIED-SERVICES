<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unified Services</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-accent: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, var(--bg-accent), var(--bg));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 480px;
    padding: 2rem 1.5rem;
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.12);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1.6rem;
    line-height: 1.4;
    font-weight: 700;
    margin-bottom: 1rem;
  }

  p.message {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .thanks {
    font-size: 0.95rem;
    color: var(--text);
    font-weight: 500;
  }

  @media (min-width: 640px) {
    h1 {
      font-size: 2rem;
    }

    p.message {
      font-size: 1.1rem;
    }
  }

  @media (min-width: 1024px) {
    .card {
      max-width: 560px;
    }

    h1 {
      font-size: 2.4rem;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Coming Soon</span>
    <h1>Welcome</h1>
    <p class="message">The actual application will be updated live by this weekend.</p>
    <p class="thanks">Thank you</p>
  </main>
</body>
</html>
